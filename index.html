<!doctype html>

    <script>
      (function () {
        try {
          window.__copilot_logs = window.__copilot_logs || {
            errors: [],
            rejections: [],
            console: [],
          };
          window.addEventListener(
            "error",
            function (ev) {
              try {
                window.__copilot_logs.errors.push({
                  message: ev && ev.message,
                  filename: ev && ev.filename,
                  lineno: ev && ev.lineno,
                  colno: ev && ev.colno,
                  stack:
                    (ev && ev.error && ev.error.stack) ||
                    (ev && ev.stack) ||
                    null,
                  time: Date.now(),
                });
              } catch (e) {}
            },
            true,
          );
          window.addEventListener(
            "unhandledrejection",
            function (ev) {
              try {
                window.__copilot_logs.rejections.push({
                  reason:
                    ev && ev.reason && (ev.reason.stack || String(ev.reason)),
                  time: Date.now(),
                });
              } catch (e) {}
            },
            true,
          );
          ["error", "warn", "log", "info"].forEach(function (level) {
            var orig = console[level];
            console[level] = function () {
              try {
                var args = Array.prototype.slice
                  .call(arguments)
                  .map(function (a) {
                    try {
                      return typeof a === "object"
                        ? JSON.stringify(a)
                        : String(a);
                    } catch (e) {
                      return String(a);
                    }
                  });
                window.__copilot_logs.console.push({
                  level: level,
                  args: args,
                  time: Date.now(),
                });
              } catch (e) {}
              try {
                orig.apply(console, arguments);
              } catch (e) {}
            };
          });
        } catch (e) {}
      })();
    </script>

      (function () {
        try {
          const dump = document.getElementById("dump-ai-logs");
          const show = document.getElementById("show-ai-logs");
          const out = document.getElementById("ai-debug-output");
          if (dump)
            dump.addEventListener("click", function () {
              try {
                // try direct window.ai first
                if (window.ai) {
                  const a = window.ai;
                  if (typeof a.exportProfilesToWindow === "function")
                    try {
                      a.exportProfilesToWindow();
                    } catch (e) {}
                  if (typeof a.getLogs === "function")
                    try {
                      window.aiLogs = a.getLogs();
                    } catch (e) {}
                  if (typeof a.getAllProfileEvents === "function")
                    try {
                      window.workerProfiles = a.getAllProfileEvents();
                    } catch (e) {}
                }
                // scan window for AI-like objects if nothing found
                if (!window.aiLogs || !window.workerProfiles) {
                  try {
                    for (const k of Object.keys(window)) {
                      try {
                        const v = window[k];
                        if (!v || typeof v !== "object") continue;
                        if (!window.aiLogs && typeof v.getLogs === "function") {
                          try {
                            window.aiLogs = v.getLogs();
                          } catch (e) {}
                        }
                        if (
                          !window.workerProfiles &&
                          typeof v.getAllProfileEvents === "function"
                        ) {
                          try {
                            window.workerProfiles = v.getAllProfileEvents();
                          } catch (e) {}
                        }
                        if (window.aiLogs && window.workerProfiles) break;
                      } catch (ee) {}
                    }
                  } catch (ee) {}
                }
                out.textContent =
                  "export attempted; aiLogs=" +
                  (Array.isArray(window.aiLogs)
                    ? window.aiLogs.length
                    : !!window.aiLogs
                      ? "1"
                      : "0") +
                  " workerProfiles=" +
                  (Array.isArray(window.workerProfiles)
                    ? window.workerProfiles.length
                    : !!window.workerProfiles
                      ? "1"
                      : "0");
              } catch (e) {
                out.textContent = "export error: " + String(e);
              }
            });
          const runBtn = document.getElementById("run-hold-sweep");
          if (runBtn)
            runBtn.addEventListener("click", async function () {
              try {
                out.textContent = "running hold-threshold sweep...";
                const ai = window.ai;
                if (!ai || typeof ai.runHoldThresholdSweep !== "function") {
                  out.textContent = "AI sweep not available";
                  return;
                }
                const res = await ai.runHoldThresholdSweep(
                  [4, 8, 12, 16],
                  6000,
                );
                try {
                  window.__holdThresholdSweepResults = res;
                } catch (e) {}
                out.textContent =
                  "sweep complete: " +
                  (Array.isArray(res) ? "results:" + res.length : String(res));
              } catch (e) {
                out.textContent = "sweep error: " + String(e);
              }
            });
          const autoBtn = document.getElementById("auto-tune-hold");
          if (autoBtn)
            autoBtn.addEventListener("click", async function () {
              try {
                out.textContent =
                  "running auto-tune hold threshold (this may take ~1-4 minutes)...";
                const ai = window.ai;
                if (!ai || typeof ai.autoTuneHoldThreshold !== "function") {
                  out.textContent = "AI auto-tune not available";
                  return;
                }
                const r = await ai.autoTuneHoldThreshold({
                  thresholds: [4, 8, 12, 16],
                  durationMs: 60000,
                });
                try {
                  window.__autoTuneResult = r;
                } catch (e) {}
                try {
                  // reflect chosen value into UI input if present
                  if (r && typeof r.chosen === "number") {
                    const inp = document.getElementById(
                      "hold-improvement-threshold",
                    );
                    if (inp && typeof inp.value === "string")
                      try {
                        inp.value = String(r.chosen);
                      } catch (ee) {}
                  }
                } catch (e) {}
                out.textContent =
                  "auto-tune complete: chosen=" +
                  String(r && r.chosen) +
                  " score=" +
                  String(r && r.score);
              } catch (e) {
                out.textContent = "auto-tune error: " + String(e);
              }
            });
          if (show)
            show.addEventListener("click", function () {
              try {
                if (window.ai && typeof window.ai.getLogs === "function") {
                  const logs = window.ai.getLogs();
                  out.textContent = Array.isArray(logs)
                    ? logs.slice(-200).join("\n")
                    : String(logs);
                } else if (window.aiLogs) {
                  out.textContent = Array.isArray(window.aiLogs)
                    ? window.aiLogs.slice(-200).join("\n")
                    : String(window.aiLogs);
                } else {
                  out.textContent = "no ai logs available";
                }
              } catch (e) {
                out.textContent = "show error: " + String(e);
              }
            });
          // force dump: write last N logs and profiles as JSON into the output
          const forceDump = document.getElementById("force-dump-ai");
          if (forceDump)
            forceDump.addEventListener("click", function () {
              try {
                const a = window.ai;
                let logs = [];
                let profiles = [];
                try {
                  logs =
                    a && typeof a.getLogs === "function"
                      ? a.getLogs()
                      : window.aiLogs || [];
                } catch (e) {
                  logs = window.aiLogs || [];
                }
                try {
                  profiles =
                    a && typeof a.getAllProfileEvents === "function"
                      ? a.getAllProfileEvents()
                      : window.workerProfiles || window.__workerProfiles || [];
                } catch (e) {
                  profiles =
                    window.workerProfiles || window.__workerProfiles || [];
                }
                const L = Array.isArray(logs)
                  ? logs.slice(-200)
                  : [String(logs)];
                const P = Array.isArray(profiles)
                  ? profiles.slice(-50)
                  : [String(profiles)];
                const outObj = { aiEnabled: !!a, logs: L, profiles: P };
                out.textContent = JSON.stringify(outObj, null, 2);
              } catch (e) {
                out.textContent = "force-dump error: " + String(e);
              }
            });
          // AI debug panel visibility toggle from AI settings
          try {
            const panelToggle = document.getElementById(
              "ai-debug-panel-toggle",
            );
            const aiDebugPanel = document.getElementById("ai-debug");
            if (panelToggle) {
              // initialize from localStorage if present
              try {
                const stored = localStorage.getItem("aiDebugPanelVisible");
                if (stored !== null) {
                  const visible = stored === "1";
                  panelToggle.checked = visible;
                  if (aiDebugPanel)
                    aiDebugPanel.style.display = visible ? "" : "none";
                }
              } catch (e) {}
              panelToggle.addEventListener("change", function () {
                try {
                  const visible = !!panelToggle.checked;
                  if (aiDebugPanel)
                    aiDebugPanel.style.display = visible ? "" : "none";
                  // also toggle AI internal debug flag if available
                  try {
                    if (
                      window.ai &&
                      typeof window.ai.setDebugEnabled === "function"
                    )
                      window.ai.setDebugEnabled(visible);
                  } catch (e) {}
                  try {
                    localStorage.setItem(
                      "aiDebugPanelVisible",
                      visible ? "1" : "0",
                    );
                  } catch (e) {}
                } catch (e) {}
              });
            }
          } catch (e) {}
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        function getTransformX(el) {
          const s = window.getComputedStyle(el).transform;
          if (!s || s === "none") return 0;
          const m = s.match(/matrix\(([^)]+)\)/);
          if (!m) return 0;
          const vals = m[1].split(",").map((v) => parseFloat(v));
          return vals.length === 6 ? vals[4] || 0 : 0;
        }
        function syncHud() {
          const board = document.getElementById("board");
          const hud = document.getElementById("hud");
          if (!board || !hud) return;
          const gap = 24;
          const b = board.getBoundingClientRect();
          const h = hud.getBoundingClientRect();
          // compute how many px we need to push hud to the right so its left >= board.right + gap
          const delta = Math.max(0, Math.round(b.right + gap - h.left));
          if (delta > 0) {
            hud.style.marginLeft = delta + "px";
          } else {
            hud.style.marginLeft = "";
          }
          // vertical: align hud top to board top using transform (visual translate)
          try {
            const deltaY = Math.round(b.top - h.top);
            if (deltaY !== 0) {
              hud.style.transform = `translateY(${deltaY}px)`;
            } else {
              hud.style.transform = "";
            }
          } catch (e) {}
        }
        window.addEventListener("resize", syncHud);
        window.addEventListener("load", function () {
          setTimeout(syncHud, 60);
        });
        try {
          const b = document.getElementById("board");
          if (b && window.ResizeObserver) {
            const ro = new ResizeObserver(syncHud);
            ro.observe(b);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        try {
          const poolRange = document.getElementById("worker-pool-size-range");
          const poolNumber = document.getElementById("worker-pool-size-number");
          function applyPool(v) {
            try {
              const n = Math.max(1, Math.floor(Number(v) || 1));
              if (
                window.ai &&
                typeof window.ai.setWorkerPoolSize === "function"
              ) {
                try {
                  window.ai.setWorkerPoolSize(n);
                } catch (e) {}
              }
            } catch (e) {}
          }
          if (poolRange && poolNumber) {
            try {
              if (
                window.ai &&
                typeof window.ai.getWorkerPoolSize === "function"
              ) {
                const cur = window.ai.getWorkerPoolSize();
                if (typeof cur === "number") {
                  poolRange.value = String(cur);
                  poolNumber.value = String(cur);
                }
              }
            } catch (e) {}
            poolRange.addEventListener("input", function () {
              try {
                poolNumber.value = poolRange.value;
                applyPool(poolRange.value);
              } catch (e) {}
            });
            poolNumber.addEventListener("change", function () {
              try {
                poolRange.value = poolNumber.value;
                applyPool(poolNumber.value);
              } catch (e) {}
            });
          }
        } catch (e) {}
      })();
    </script>
