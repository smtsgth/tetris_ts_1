          function makeCanvas(id,title){ const wrap=document.createElement('div'); wrap.className='chart-wrap'; const h=document.createElement('h3'); h.textContent=title; wrap.appendChild(h); const c=document.createElement('canvas'); c.id=id; c.width=860; c.height=360; wrap.appendChild(c); document.getElementById('charts').appendChild(wrap); return c; }

          function drawChartFor(sideTitle, getValsFunc, outIdPrefix, bins){
            const variants = Object.keys(data);
            // collect combined domain
            let combined=[]; for(const v of variants) combined=combined.concat(getValsFunc(data[v])||[]);
            if (combined.length===0) return;
            const min = Math.min(...combined); const max = Math.max(...combined);
            const histAll = histogram(combined, bins, min, max);
            const charts = [];
            for(const side of ['left','right']){
              if (sideTitle==='soft' && side!=='left') continue; // soft handled separately
            }

            // initial gap chart
            const idInit = outIdPrefix + '-initial';
            const cInit = makeCanvas(idInit, sideTitle + ' — initial gaps (keydown → first arr)');
            const datasetsInit = [];
            for (let i=0;i<variants.length;i++){
              const v = variants[i];
              const vals = getValsFunc(data[v]) || [];
              const info = histogram(vals, histAll.counts.length, histAll.lo, histAll.hi) || {counts:Array.from({length:histAll.counts.length},()=>0),centers:histAll.centers,binWidth:histAll.binWidth,N:0};
              const counts = info.counts;
              const points = info.centers.map((c,j)=>({x:c,y:counts[j]}));
              const density = kdeEstimate(vals, info.centers);
              const scaledDensity = density.map(d => d * (vals.length) * info.binWidth);
              const kdPoints = info.centers.map((c,j)=>({x:c,y: +scaledDensity[j].toFixed(3)}));
              const color = ['rgba(78,121,167,0.6)','rgba(242,142,43,0.6)','rgba(225,87,89,0.6)','rgba(118,183,178,0.6)'][i%4];
              datasetsInit.push({ type: 'bar', label: v + ' (hist)', data: points, backgroundColor: color, borderColor: color, borderWidth:1 });
              datasetsInit.push({ type: 'line', label: v + ' (KDE)', data: kdPoints, borderColor: color.replace('0.6','1'), backgroundColor: color.replace('0.6','0.12'), fill: true, tension: 0.3, pointRadius:0 });
              // store stats for markers
              const st = stats(vals);
              if (!cInit._markers) cInit._markers = [];
              if (st) cInit._markers.push({value: st.mean, color: color.replace('0.6','1'), label: v + ' mean'});
              if (st) cInit._markers.push({value: st.median, color: color.replace('0.6','1'), label: v + ' median', dash:[5,5]});
            }

            const chartInit = new Chart(cInit.getContext('2d'), {
              data: { datasets: datasetsInit },
              options: {
                responsive:false,
                scales: { x: { type: 'linear', title: { display: true, text: 'ms' } }, y: { title: { display: true, text: 'count' } } },
                plugins: { legend: { position: 'top' } },
                animation: false
              },
              plugins: [{ id: 'vlines', afterDraw(chart){ const ctx = chart.ctx; const canvas = chart.canvas; const area = chart.chartArea; const lo = histAll.lo; const hi = histAll.hi; const width = area.right - area.left; if (!chart.canvas._markers) chart.canvas._markers = cInit._markers || []; const markers = chart.canvas._markers; for(const m of markers){ const x = area.left + ((m.value - lo)/(hi-lo))*width; ctx.save(); ctx.beginPath(); ctx.strokeStyle = m.color || '#000'; ctx.lineWidth = 1.5; if (m.dash) ctx.setLineDash(m.dash); ctx.moveTo(x, area.top); ctx.lineTo(x, area.bottom); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = m.color || '#000'; ctx.font = '12px sans-serif'; ctx.fillText(m.label, x+4, area.top+14); ctx.restore(); } }}]
            });

            // ARR chart
            const idArr = outIdPrefix + '-arr';
            const cArr = makeCanvas(idArr, sideTitle + ' — ARR intervals');
            const datasetsArr = [];
            const arrAll = [].concat(...variants.map(v=> (data[v].leftARRs||[])), ...variants.map(v=>(data[v].rightARRs||[])) );
            const histArrAll = histogram(arrAll,bins);
            for (let i=0;i<variants.length;i++){
              const v = variants[i];
              const left = data[v].leftARRs || [];
              const right = data[v].rightARRs || [];
              const vals = left.concat(right);
              const info = histogram(vals, histArrAll?histArrAll.counts.length:bins);
              if (!info) continue;
              const points = info.centers.map((c,j)=>({x:c,y:info.counts[j]}));
              const dens = kdeEstimate(vals, info.centers);
              const scaled = dens.map(d=> d * vals.length * info.binWidth);
              const kdPoints = info.centers.map((c,j)=>({x:c,y: +scaled[j].toFixed(3)}));
              const color = ['rgba(89,161,79,0.6)','rgba(237,201,72,0.6)','rgba(176,122,161,0.6)','rgba(255,157,167,0.6)'][i%4];
              datasetsArr.push({ type:'bar', label: v + ' (hist)', data: points, backgroundColor: color, borderColor: color, borderWidth:1 });
              datasetsArr.push({ type:'line', label: v + ' (KDE)', data: kdPoints, borderColor: color.replace('0.6','1'), backgroundColor: color.replace('0.6','0.12'), fill:true, tension:0.3, pointRadius:0 });
            }
            const chartArr = new Chart(cArr.getContext('2d'), { data:{ datasets: datasetsArr }, options:{ responsive:false, scales:{ x:{ type:'linear', title:{display:true,text:'ms'} }, y:{ title:{display:true,text:'count'} } }, plugins:{ legend:{ position:'top' } }, animation:false });
            return { chartInit, chartArr };
          }

          // build initial-gap and ARR charts
          drawChartFor('Key press → first ARR', d=>d.leftInitials.concat(d.rightInitials), 'chart');

          // soft-drop combined chart
          (function(){ const variants=Object.keys(data); let combined=[]; for(const v of variants) combined = combined.concat(data[v].softIntervals||[]); if (combined.length===0) return; const id='chart-soft'; const c=makeCanvas(id,'Soft-drop intervals (aggregated)'); const hist= (function(){ const bins=40; const min=Math.min(...combined); const max=Math.max(...combined); return histogram(combined,bins,min,max); })(); if(!hist) return; const pts = hist.centers.map((c2,i)=>({x:c2,y:hist.counts[i]})); const dens = kdeEstimate(combined,hist.centers); const scaled = dens.map(d=> d * combined.length * hist.binWidth); const kdPts = hist.centers.map((c2,i)=>({x:c2,y:+scaled[i].toFixed(3)})); new Chart(c.getContext('2d'), { data:{ datasets:[ { type:'bar', label:'soft (hist)', data:pts, backgroundColor:'rgba(140,209,125,0.7)', borderColor:'rgba(140,209,125,0.9)', borderWidth:1 }, { type:'line', label:'soft (KDE)', data:kdPts, borderColor:'rgba(60,160,60,1)', backgroundColor:'rgba(60,160,60,0.12)', fill:true, tension:0.3, pointRadius:0 } ] }, options:{ responsive:false, scales:{ x:{ type:'linear', title:{display:true,text:'ms'} }, y:{ title:{display:true,text:'count'} } }, plugins:{ legend:{ position:'top' } }, animation:false }); })();
        } catch (e) {
          console.error('CHARTS_ERROR', e && e.stack ? e.stack : e);
          window.chartsError = e && e.stack ? e.stack : String(e);
        } finally {
          window.chartsReady = true;
        }
      }

      // load Chart.js dynamically to avoid blocking if CDN is slow/unreachable
      try {
        if (typeof Chart !== 'undefined') { proceed(); }
        else {
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js';
          s.onload = proceed;
          s.onerror = function(){ window.chartsError = 'Chart.js failed to load'; window.chartsReady = true; };
          document.head.appendChild(s);
          setTimeout(function(){ if(!window.chartsReady){ window.chartsError = 'Chart.js load timeout'; window.chartsReady = true; } }, 25000);
        }
      } catch(e){ console.error('LOAD_ERROR', e); window.chartsError = String(e); window.chartsReady = true; }
    })();
  </script>
